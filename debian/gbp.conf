[DEFAULT]
debian-branch = keel/trixie
upstream-branch = upstream
upstream-tag = upstream/%(version)s
debian-tag = keel/%(version)s
debian-tag-msg = %(pkg)s Keel release %(version)s for trixie
# The npm component was assembled from package-lock.json, not released
# upstream (debian/README.source), so there is no tarball to keep in
# pristine-tar: gbp builds both orig tarballs from upstream/<version>.
pristine-tar = False
component = npm
