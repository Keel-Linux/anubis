[DEFAULT]
debian-branch = keel/trixie
upstream-branch = upstream
upstream-tag = upstream/%(version)s
debian-tag = keel/%(version)s
debian-tag-msg = %(pkg)s Keel release %(version)s for trixie
# The npm component was assembled from package-lock.json, and the
# wasm-modules component taken from upstream's npm vendor tarball
# (debian/README.source), so there is no tarball to keep in pristine-tar:
# gbp builds the three orig tarballs from upstream/<version>.
pristine-tar = False
component = ['npm', 'wasm-modules']
